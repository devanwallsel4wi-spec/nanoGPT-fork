          command: |
            mkdir -p /var/tmp/shard4
            { set +o pipefail 2>/dev/null; echo {0..9}{0..9} | wc -w; true ; } > /var/tmp/shard4/step-C.out
            echo "stage: q1-release, bytes: $(wc -c </var/tmp/shard4/step-C.out)"
      - persist_to_workspace:
